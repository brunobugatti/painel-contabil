<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Gestão — Escritório Contábil</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* light (default) */
  --bg:#f5f4ef; --bg2:#ffffff; --card:#ffffff; --card2:#f1efe8;
  --border:#e2ded2; --text:#1c2321; --text2:#5b6460; --text3:#8b938d;
  --accent:#0f6f5c; --accent2:#128268; --accent-ink:#ffffff;
  --green:#1f8a5f; --yellow:#a3730a; --red:#c23b3b; --purple:#6a5acd;
  --blue:#2563eb; --teal:#0d9488; --orange:#c2610a; --pink:#c22a7d;
  --shadow:0 8px 24px rgba(30,35,30,.07);
  --font-display:'Sora',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --font-body:'Public Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101615; --bg2:#161d1c; --card:#1a2220; --card2:#202b28;
    --border:#2b3634; --text:#e8ece9; --text2:#a2ada7; --text3:#71807a;
    --accent:#2fd6ac; --accent2:#5be3c4; --accent-ink:#08211b;
    --green:#34c98f; --yellow:#e0b34d; --red:#f0817a; --purple:#b3a3f5;
    --blue:#5b9bff; --teal:#3fd6c4; --orange:#f0a355; --pink:#f087bb;
    --shadow:0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#101615; --bg2:#161d1c; --card:#1a2220; --card2:#202b28;
  --border:#2b3634; --text:#e8ece9; --text2:#a2ada7; --text3:#71807a;
  --accent:#2fd6ac; --accent2:#5be3c4; --accent-ink:#08211b;
  --green:#34c98f; --yellow:#e0b34d; --red:#f0817a; --purple:#b3a3f5;
  --blue:#5b9bff; --teal:#3fd6c4; --orange:#f0a355; --pink:#f087bb;
  --shadow:0 8px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg); color:var(--text); min-height:100vh;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,.brand{ font-family:var(--font-display); text-wrap:balance; }
.app{display:flex; min-height:100vh;}
.sidebar{
  width:230px; background:var(--bg2); border-right:1px solid var(--border);
  padding:20px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;
}
.brand{padding:6px 10px 20px; font-weight:700; font-size:17px; letter-spacing:-.3px;}
.brand span{color:var(--accent);}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  cursor:pointer; color:var(--text2); font-size:14px; font-weight:500; transition:.15s;
}
.nav-item:hover{background:var(--card2); color:var(--text);}
.nav-item.active{background:var(--accent); color:var(--accent-ink);}
.nav-icon{width:18px; text-align:center; font-size:15px;}
.main{flex:1; padding:26px 32px; overflow-x:hidden; max-width:100%;}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
.topbar h1{font-size:22px; font-weight:700; letter-spacing:-.3px;}
.topbar .sub{color:var(--text3); font-size:13px; margin-top:2px;}
.actions{display:flex; gap:8px; flex-wrap:wrap;}
button, .btn{
  font-family:inherit; border:1px solid var(--border); background:var(--card);
  color:var(--text); padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600;
  cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px;
}
button:hover{border-color:var(--accent); color:var(--accent);}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.btn-primary:hover{background:var(--accent2); color:var(--accent-ink); border-color:var(--accent2);}
.btn-danger:hover{border-color:var(--red); color:var(--red);}
.btn-sm{padding:5px 10px; font-size:12px;}
.grid-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:24px;}
.stat-card{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px;
  box-shadow:var(--shadow);
}
.stat-card .label{color:var(--text3); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.stat-card .value{font-size:28px; font-weight:700; margin-top:6px;}
.stat-card .delta{font-size:12px; margin-top:4px; color:var(--text2);}
.dot{width:8px;height:8px;border-radius:50%; display:inline-block; margin-right:6px;}
.section{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px; box-shadow:var(--shadow);}
.section h2{font-size:15px; font-weight:700; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center;}
.section h2 .count{color:var(--text3); font-weight:500; font-size:12px;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:left; color:var(--text3); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border); font-size:11px; text-transform:uppercase; letter-spacing:.3px; white-space:nowrap;}
td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--card2);}
.badge{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; display:inline-flex; align-items:center; gap:5px; white-space:nowrap;}
.badge.green{background:rgba(62,207,142,.15); color:var(--green);}
.badge.yellow{background:rgba(240,180,41,.15); color:var(--yellow);}
.badge.red{background:rgba(240,85,90,.15); color:var(--red);}
.badge.gray{background:var(--card2); color:var(--text3);}
.badge.purple{background:rgba(167,139,250,.15); color:var(--purple);}
.badge.blue{background:rgba(59,130,246,.15); color:var(--blue);}
.badge.teal{background:rgba(20,184,166,.15); color:var(--teal);}
.badge.orange{background:rgba(249,115,22,.15); color:var(--orange);}
.badge.pink{background:rgba(236,72,153,.15); color:var(--pink);}
.empty{color:var(--text3); font-size:13px; padding:30px 10px; text-align:center;}
.toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
input, select, textarea{
  font-family:inherit; background:var(--bg2); border:1px solid var(--border); color:var(--text);
  padding:8px 11px; border-radius:9px; font-size:13px; outline:none;
}
input:focus, select:focus, textarea:focus{border-color:var(--accent);}
.search{flex:1; min-width:180px;}
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center;
  justify-content:center; z-index:100; padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--bg2); border:1px solid var(--border); border-radius:16px; padding:24px;
  width:100%; max-width:460px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow);
}
.modal h3{font-size:16px; margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text2); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%;}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}
.icon-btn{padding:5px 8px; font-size:12px;}
.tabs-inline{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tab-pill{padding:6px 13px; border-radius:20px; font-size:12px; font-weight:600; border:1px solid var(--border); cursor:pointer; color:var(--text2);}
.tab-pill.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.footer-note{color:var(--text3); font-size:11px; text-align:center; margin-top:20px;}
.briefing{display:flex; gap:14px; align-items:flex-start; position:relative; background:linear-gradient(135deg, var(--card), var(--card2)); border-color:var(--accent);}
.briefing-avatar{width:38px; height:38px; border-radius:50%; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0;}
.briefing-greeting{font-family:var(--font-display); font-weight:700; font-size:15px; margin-bottom:4px;}
.briefing-text{font-size:13px; color:var(--text2); line-height:1.6;}
.briefing-close{position:absolute; top:14px; right:14px; border:none; background:transparent; color:var(--text3); padding:2px 6px; font-size:13px;}
.briefing-close:hover{color:var(--text); border:none;}
.view-toggle{display:flex; gap:4px; background:var(--card2); border-radius:9px; padding:3px;}
.view-toggle button{border:none; background:transparent; padding:6px 12px; font-size:12px; border-radius:7px;}
.view-toggle button.active{background:var(--card); box-shadow:var(--shadow); color:var(--accent);}
.feed{display:flex; flex-direction:column; gap:0;}
.feed-day{display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--border);}
.feed-day:last-child{border-bottom:none;}
.feed-day-label{width:96px; flex-shrink:0; padding-top:2px;}
.feed-day-label .dow{font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.4px;}
.feed-day-label .dom{font-family:var(--font-display); font-size:20px; font-weight:700;}
.feed-day-label.today .dom{color:var(--accent);}
.feed-items{flex:1; display:flex; flex-direction:column; gap:8px;}
.feed-item{display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--card2); border-radius:10px; font-size:13px;}
.feed-item .fi-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.feed-item .fi-main{flex:1; min-width:0;}
.feed-item .fi-title{font-weight:600;}
.feed-item .fi-sub{color:var(--text3); font-size:11px; margin-top:1px;}
.feed-item .fi-value{font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
.cal-nav{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.cal-nav .cal-title{font-family:var(--font-display); font-weight:700; font-size:15px; min-width:150px; text-align:center; text-transform:capitalize;}
.calendar{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
.cal-head{font-size:11px; color:var(--text3); text-align:center; font-weight:700; padding:4px 0; text-transform:uppercase;}
.cal-day{background:var(--card2); border-radius:9px; min-height:76px; padding:6px; font-size:11px; border:1px solid transparent;}
.cal-day.today{border-color:var(--accent);}
.cal-day.empty{background:transparent;}
.cal-day .dnum{font-weight:700; margin-bottom:4px; color:var(--text2);}
.cal-day .cev{border-radius:5px; padding:2px 5px; margin-bottom:2px; font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cal-day .cev.pago{background:rgba(62,207,142,.2); color:var(--green);}
.cal-day .cev.pendente{background:rgba(240,180,41,.2); color:var(--yellow);}
.cal-day .cev.atrasado{background:rgba(240,85,90,.2); color:var(--red);}
.cal-day .ctotal{font-size:10px; color:var(--text3); margin-top:2px; font-variant-numeric:tabular-nums;}
@media print{
  .sidebar, .actions, .modal-overlay, .briefing-close, #toastEl, .tabs-inline, .view-toggle{display:none !important;}
  .main{padding:0 !important;}
  body{background:#fff !important; color:#000 !important;}
  .section, .stat-card{box-shadow:none !important; border:1px solid #ccc !important;}
}
.kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.kanban-col{background:var(--card2); border-radius:12px; padding:12px; min-height:200px;}
.kanban-col h4{font-size:12px; text-transform:uppercase; color:var(--text3); margin-bottom:10px; letter-spacing:.4px;}
.kanban-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; font-size:13px; cursor:pointer;}
.kanban-card:hover{border-color:var(--accent);}
.kanban-card .meta{font-size:11px; color:var(--text3); margin-top:5px;}
#authScreen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg);}
.auth-box{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:32px; width:100%; max-width:360px; box-shadow:var(--shadow);}
.auth-box h1{font-size:20px; margin-bottom:4px;}
.auth-box .sub{color:var(--text3); font-size:13px; margin-bottom:20px;}
.auth-box .field{margin-bottom:14px;}
.auth-error{color:var(--red); font-size:12px; margin-top:6px; min-height:16px;}
.auth-switch{text-align:center; font-size:12px; color:var(--text3); margin-top:14px; cursor:pointer;}
.auth-switch span{color:var(--accent); font-weight:600;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
@media(max-width:820px){
  .app{flex-direction:column;}
  .sidebar{width:100%; flex-direction:row; overflow-x:auto; padding:10px;}
  .nav-item{flex-shrink:0;}
  .main{padding:18px;}
  .kanban{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h1>📊 Painel<span style="color:var(--accent)">Contábil</span></h1>
    <div class="sub" id="authSub">Entre com sua conta da equipe</div>
    <div class="field"><label>E-mail</label><input id="authEmail" type="email" placeholder="voce@escritorio.com"></div>
    <div class="field"><label>Senha</label><input id="authPass" type="password" placeholder="••••••••"></div>
    <div class="field hidden" id="authNomeField"><label>Seu nome</label><input id="authNome" type="text" placeholder="Nome completo"></div>
    <button class="btn-primary" id="authSubmit" style="width:100%; justify-content:center;">Entrar</button>
    <div class="auth-error" id="authError"></div>
    <div class="auth-switch" id="authSwitch">Novo por aqui? <span>Criar conta da equipe</span></div>
  </div>
</div>

<div class="app hidden" id="appRoot">
  <div class="sidebar">
    <div class="brand">📊 Painel<span>Contábil</span></div>
    <div class="nav-item active" data-view="dashboard"><span class="nav-icon">🏠</span> Visão Geral</div>
    <div class="nav-item" data-view="empresas"><span class="nav-icon">🏢</span> Empresas</div>
    <div class="nav-item" data-view="documentos"><span class="nav-icon">📁</span> Documentos</div>
    <div class="nav-item" data-view="obrigacoes"><span class="nav-icon">📋</span> Obrigações</div>
    <div class="nav-item" data-view="financeiro"><span class="nav-icon">💰</span> Financeiro</div>
    <div class="nav-item" data-view="licencas"><span class="nav-icon">🪪</span> Licenças</div>
    <div class="nav-item" data-view="tarefas"><span class="nav-icon">✅</span> Tarefas</div>
    <div class="nav-item" data-view="agenda"><span class="nav-icon">📅</span> Agenda</div>
    <div style="flex:1"></div>
    <div class="nav-item" id="logoutBtn"><span class="nav-icon">🚪</span> Sair</div>
  </div>
  <div class="main" id="main"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBody"></div>
</div>

<script>
/* ================= CONFIG ================= */
const SUPABASE_URL = "https://lhomobamwjqgamwwrgip.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_LuCYlINCYqNbgZ66OcuKiQ_pR04fYnW";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


/* ================= STATE ================= */
let STATE = { empresas:[], documentos:[], obrigacoes:[], entregas:[], mensalidades:[], despesas:[], licencas:[], tarefas:[], profiles:[], reunioes:[] };
let briefingDismissed = false;
let currentView = "dashboard";
let session = null;

/* ================= HELPERS ================= */
function fmtDate(d){ if(!d) return "—"; const dt = new Date(d+"T00:00:00"); return dt.toLocaleDateString("pt-BR"); }
function fmtMoney(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function daysUntil(d){ if(!d) return null; const today=new Date(); today.setHours(0,0,0,0); const dt=new Date(d+"T00:00:00"); return Math.round((dt-today)/86400000); }
function escapeHtml(s){ return (s==null?"":s).toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(){ return crypto.randomUUID(); }
function empresaNome(id){ const e = STATE.empresas.find(e=>e.id===id); return e? e.nome : "—"; }
/* ================= TIPOS DE OBRIGAÇÃO (fixos) ================= */
const TIPOS_OBRIGACAO = [
  { id:"Holerite", label:"Holerite / Folha", icon:"💰", cls:"purple" },
  { id:"DCTFWeb",  label:"DCTFWeb",           icon:"📄", cls:"blue" },
  { id:"DAS",      label:"DAS",               icon:"🧾", cls:"yellow" },
  { id:"DAS-MEI",  label:"DAS-MEI",           icon:"🧾", cls:"teal" },
  { id:"MIT",      label:"MIT",               icon:"📋", cls:"orange" },
  { id:"PGDAS",    label:"PGDAS",             icon:"📊", cls:"pink" },
  { id:"INSS",     label:"INSS",              icon:"🏥", cls:"red" },
  { id:"FGTS",     label:"FGTS",              icon:"🏦", cls:"green" },
  { id:"Outro",    label:"Outro",             icon:"📎", cls:"gray" },
];
function tipoInfo(id){ return TIPOS_OBRIGACAO.find(t=>t.id===id) || TIPOS_OBRIGACAO[TIPOS_OBRIGACAO.length-1]; }
function tipoBadge(id){ const t = tipoInfo(id); return `<span class="badge ${t.cls}">${t.icon} ${t.label}</span>`; }
function tipoOptions(selected){ return TIPOS_OBRIGACAO.map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${t.icon} ${t.label}</option>`).join(""); }

/* ================= EXPORT (CSV / PDF) ================= */
function exportCSV(filename, headers, rows){
  const esc = v => { const s = (v==null?"":String(v)); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const lines = [headers.map(esc).join(";"), ...rows.map(r=>r.map(esc).join(";"))];
  const blob = new Blob(["﻿"+lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function printPage(){ window.print(); }

function empresaOptions(selected){ return `<option value="">— selecione —</option>` + STATE.empresas.map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${escapeHtml(e.nome)}</option>`).join(""); }
function profileOptions(selected){ return `<option value="">— ninguém —</option>` + STATE.profiles.map(p=>`<option value="${p.id}" ${p.id===selected?'selected':''}>${escapeHtml(p.nome||p.email)}</option>`).join(""); }

function dueBadge(dateStr, status){
  if(status === "pago" || status === "entregue") return `<span class="badge green">✔ ${status==='pago'?'Pago':'Entregue'}</span>`;
  const diff = daysUntil(dateStr);
  if(diff === null) return `<span class="badge gray">—</span>`;
  if(diff < 0) return `<span class="badge red">⚠ Atrasado (${Math.abs(diff)}d)</span>`;
  if(diff <= 5) return `<span class="badge yellow">⏳ ${diff===0?'Hoje':diff+'d restantes'}</span>`;
  return `<span class="badge gray">${diff}d restantes</span>`;
}

function toast(msg, isError){
  let t = document.getElementById("toastEl");
  if(!t){ t = document.createElement("div"); t.id="toastEl"; t.style.cssText="position:fixed;bottom:20px;right:20px;z-index:200;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);"; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.background = isError? "var(--red)" : "var(--green)";
  t.style.color = "#fff";
  t.style.display = "block";
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.display="none"; }, 3000);
}

/* ================= MODAL ================= */
function openModal(html){ document.getElementById("modalBody").innerHTML = html; document.getElementById("modalOverlay").classList.add("open"); }
function closeModal(){ document.getElementById("modalOverlay").classList.remove("open"); }
function confirmDialog(msg){
  return new Promise(resolve=>{
    openModal(`<h3>Confirmar ação</h3><p style="color:var(--text2); font-size:13px; line-height:1.5;">${escapeHtml(msg)}</p>
      <div class="modal-actions"><button id="confirmNo">Cancelar</button><button class="btn-primary" id="confirmYes">Confirmar</button></div>`);
    document.getElementById("confirmNo").onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById("confirmYes").onclick = ()=>{ closeModal(); resolve(true); };
  });
}
document.getElementById("modalOverlay").addEventListener("click", e=>{ if(e.target.id==="modalOverlay") closeModal(); });

/* ================= AUTH ================= */
let authMode = "login";
document.getElementById("authSwitch").addEventListener("click", ()=>{
  authMode = authMode === "login" ? "signup" : "login";
  document.getElementById("authNomeField").classList.toggle("hidden", authMode==="login");
  document.getElementById("authSub").textContent = authMode==="login" ? "Entre com sua conta da equipe" : "Crie sua conta para acessar o painel";
  document.getElementById("authSubmit").textContent = authMode==="login" ? "Entrar" : "Criar conta";
  document.getElementById("authSwitch").innerHTML = authMode==="login" ? 'Novo por aqui? <span>Criar conta da equipe</span>' : 'Já tem conta? <span>Entrar</span>';
  document.getElementById("authError").textContent = "";
});
document.getElementById("authSubmit").addEventListener("click", async ()=>{
  const email = document.getElementById("authEmail").value.trim();
  const pass = document.getElementById("authPass").value;
  const nome = document.getElementById("authNome").value.trim();
  const errEl = document.getElementById("authError");
  errEl.textContent = "";
  if(!email || !pass){ errEl.textContent = "Preencha e-mail e senha."; return; }
  if(authMode === "signup"){
    const { error } = await sb.auth.signUp({ email, password: pass, options:{ data:{ nome: nome || email } } });
    if(error){ errEl.textContent = error.message; return; }
    toast("Conta criada! Verifique seu e-mail se a confirmação estiver ativa.");
  } else {
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){ errEl.textContent = error.message; return; }
  }
});
document.getElementById("logoutBtn").addEventListener("click", async ()=>{ await sb.auth.signOut(); });

sb.auth.onAuthStateChange((event, sess)=>{
  session = sess;
  if(sess){
    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("appRoot").classList.remove("hidden");

/* ================= DATA LOADING ================= */
async function loadAllOnce(){
  const [empresas, documentos, obrigacoes, entregas, mensalidades, despesas, licencas, tarefas, profiles, reunioes] = await Promise.all([
    sb.from("empresas").select("*").order("nome"),
    sb.from("documentos").select("*").order("created_at",{ascending:false}),
    sb.from("obrigacoes").select("*").order("nome"),
    sb.from("obrigacoes_entregas").select("*").order("vencimento"),
    sb.from("mensalidades").select("*").order("vencimento"),
    sb.from("despesas").select("*").order("vencimento"),
    sb.from("licencas").select("*").order("vencimento"),
    sb.from("tarefas").select("*").order("created_at",{ascending:false}),
    sb.from("profiles").select("*").order("nome"),
    sb.from("reunioes").select("*").order("data_hora"),
  ]);
  const results = {empresas, documentos, obrigacoes, entregas, mensalidades, despesas, licencas, tarefas, profiles, reunioes};
  const hadError = Object.values(results).some(r=>r.error);
  STATE.empresas = empresas.data || [];
  STATE.documentos = documentos.data || [];
  STATE.obrigacoes = obrigacoes.data || [];
  STATE.entregas = entregas.data || [];
  STATE.mensalidades = mensalidades.data || [];
  STATE.despesas = despesas.data || [];
  STATE.licencas = licencas.data || [];
  STATE.tarefas = tarefas.data || [];
  STATE.profiles = profiles.data || [];
  STATE.reunioes = reunioes.data || [];
  return hadError;
}
async function loadAll(){
  const hadError = await loadAllOnce();
  if(hadError){ await new Promise(r=>setTimeout(r,500)); await loadAllOnce(); }
}

async function bootstrap(){
  await sb.auth.getSession();
  await loadAll();
  render();
}

function viewDashboard(){
  const entregasPend = STATE.entregas.filter(e=>e.status!=="entregue");

  const mensAberto = STATE.mensalidades.filter(m=>m.status!=="pago");

  const totalReceber = mensAberto.reduce((s,m)=>s+Number(m.valor||0),0);
  const licProx = STATE.licencas.filter(l=>{ const d=daysUntil(l.vencimento); return d!==null && d<=30; });
  const tarefasAbertas = STATE.tarefas.filter(t=>t.status!=="concluida");

  const eventos = [
    ...entregasPend.map(e=>{ const ob = STATE.obrigacoes.find(o=>o.id===e.obrigacao_id); return {data:e.vencimento, texto:`${ob? empresaNome(ob.empresa_id):"—"} (${e.competencia})`, badge: ob? tipoBadge(ob.tipo) : '<span class="badge gray">Obrigação</span>'}; }),

    ...STATE.despesas.filter(d=>d.status!=="pago").map(d=>({data:d.vencimento, texto:`Despesa: ${d.descricao}`, badge:'<span class="badge red">💸 Despesa</span>'})),
    ...STATE.reunioes.filter(r=>r.status!=="cancelada").map(r=>({data:r.data_hora.slice(0,10), texto:`Reunião: ${r.titulo}${r.empresa_id? " — "+empresaNome(r.empresa_id):""}`, badge:'<span class="badge blue">📅 Reunião</span>'})),

  return `

    <div class="stat-card"><div class="label">Empresas Ativas</div><div class="value">${STATE.empresas.filter(e=>e.ativo).length}</div><div class="delta">${STATE.empresas.length} cadastradas</div></div>

    <div class="stat-card"><div class="label">A Receber (aberto)</div><div class="value">${fmtMoney(totalReceber)}</div><div class="delta"><span class="dot" style="background:var(--red)"></span>${mensAtrasadas.length} vencidas</div></div>
    <div class="stat-card"><div class="label">Licenças a Vencer (30d)</div><div class="value">${licProx.length}</div><div class="delta">Fique de olho</div></div>
    <div class="stat-card"><div class="label">Tarefas Abertas</div><div class="value">${tarefasAbertas.length}</div><div class="delta">de ${STATE.tarefas.length} no total</div></div>

    ${eventos.length? `<table><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Status</th></tr></thead><tbody>
      ${eventos.map(e=>`<tr><td>${fmtDate(e.data)}</td><td>${escapeHtml(e.texto)}</td><td>${e.badge}</td><td>${dueBadge(e.data)}</td></tr>`).join("")}

/* ================= ASSISTENTE (resumo ao abrir) ================= */
function renderBriefing(){
  if(briefingDismissed) return "";
  const hour = new Date().getHours();
  const saudacao = hour<12? "Bom dia" : hour<18? "Boa tarde" : "Boa noite";
  const me = STATE.profiles.find(p=>p.id===(session && session.user && session.user.id));
  const nome = me && me.nome ? me.nome.split(" ")[0] : "";
  const hojeStr = new Date().toISOString().slice(0,10);

  const reunioesHoje = STATE.reunioes.filter(r=>r.status!=="cancelada" && r.data_hora.slice(0,10)===hojeStr).sort((a,b)=>a.data_hora.localeCompare(b.data_hora));
  const entregasAtrasadas = STATE.entregas.filter(e=>e.status!=="entregue" && daysUntil(e.vencimento)<0);
  const entregasProx = STATE.entregas.filter(e=>e.status!=="entregue" && daysUntil(e.vencimento)>=0 && daysUntil(e.vencimento)<=7);
  const mensAtrasadas = STATE.mensalidades.filter(m=>m.status!=="pago" && daysUntil(m.vencimento)<0);
  const valorAtrasado = mensAtrasadas.reduce((s,m)=>s+Number(m.valor||0),0);
  const licProx = STATE.licencas.filter(l=>{ const d=daysUntil(l.vencimento); return d!==null && d>=0 && d<=30; });
  const tarefasHoje = STATE.tarefas.filter(t=>t.status!=="concluida" && t.prazo===hojeStr);

  const frases = [];
  if(reunioesHoje.length){
    frases.push(`Você tem ${reunioesHoje.length} reunião${reunioesHoje.length>1?'ões':''} hoje: ${reunioesHoje.map(r=>`${escapeHtml(r.titulo)} às ${new Date(r.data_hora).toLocaleTimeString("pt-BR",{hour:'2-digit',minute:'2-digit'})}`).join(", ")}.`);
  }
  if(entregasAtrasadas.length || mensAtrasadas.length){
    const partes = [];
    if(entregasAtrasadas.length) partes.push(`${entregasAtrasadas.length} obrigação${entregasAtrasadas.length>1?'ões':''} acessória${entregasAtrasadas.length>1?'s':''} atrasada${entregasAtrasadas.length>1?'s':''}`);
    if(mensAtrasadas.length) partes.push(`${fmtMoney(valorAtrasado)} em mensalidades vencidas`);
    frases.push(`⚠ Atenção: ${partes.join(" e ")}.`);
  }
  if(tarefasHoje.length) frases.push(`Você tem ${tarefasHoje.length} tarefa${tarefasHoje.length>1?'s':''} com prazo para hoje.`);
  if(entregasProx.length) frases.push(`Nos próximos 7 dias vencem ${entregasProx.length} obrigaç${entregasProx.length>1?'ões':'ão'}.`);
  if(licProx.length) frases.push(`${licProx.length} licença${licProx.length>1?'s':''} vence${licProx.length>1?'m':''} nos próximos 30 dias.`);

  const corpo = frases.length? frases.join(" ") : "Tudo tranquilo por aqui — nada atrasado ou urgente para hoje. 🎉";

  return `<div class="section briefing">
    <button class="briefing-close" id="briefingClose" title="Fechar">✕</button>
    <div class="briefing-avatar">🤖</div>
    <div>
      <div class="briefing-greeting">${saudacao}${nome? ", "+escapeHtml(nome):""}!</div>
      <div class="briefing-text">${corpo}</div>
    </div>
  </div>`;
}

function renderMensFeed(rows){
  if(!rows.length) return `<div class="section"><div class="empty">Nenhuma mensalidade cadastrada.</div></div>`;
  const hojeStr = new Date().toISOString().slice(0,10);
  const porDia = {};
  rows.forEach(m=>{ (porDia[m.vencimento] = porDia[m.vencimento]||[]).push(m); });
  const dias = Object.keys(porDia).sort();
  return `<div class="section"><div class="feed">
    ${dias.map(dia=>{
      const dt = new Date(dia+"T00:00:00");
      const isToday = dia===hojeStr;
      return `<div class="feed-day">
        <div class="feed-day-label ${isToday?'today':''}">

          <div class="dow">${dt.toLocaleDateString('pt-BR',{month:'short'})}</div>
        </div>
        <div class="feed-items">
          ${porDia[dia].map(m=>{
            const dotColor = m.status==='pago'? 'var(--green)' : daysUntil(m.vencimento)<0? 'var(--red)' : 'var(--yellow)';
            return `<div class="feed-item">
              <span class="fi-dot" style="background:${dotColor}"></span>
              <div class="fi-main">
                <div class="fi-title">${escapeHtml(empresaNome(m.empresa_id))}${m.recebedor? ` <span class="badge purple" style="margin-left:4px">${escapeHtml(m.recebedor)}</span>`:''}</div>
                <div class="fi-sub">${escapeHtml(m.competencia)} · ${m.status==='pago'?'Pago':(daysUntil(m.vencimento)<0?'Atrasado':'Em aberto')}</div>
              </div>
              <div class="fi-value" style="color:${m.status==='pago'?'var(--green)':'var(--text)'}">${fmtMoney(m.valor)}</div>
              <div class="row-actions">
                ${m.status!=='pago'? `<button class="icon-btn" data-mens-pago="${m.id}">✔</button>`: `<button class="icon-btn" data-mens-reabrir="${m.id}">↺</button>`}
                <button class="icon-btn btn-danger" data-del-mens="${m.id}">🗑</button>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}

}
function renderMensCalendario(rows){
  const year = calMonth.getFullYear(), month = calMonth.getMonth();
  const hojeStr = new Date().toISOString().slice(0,10);
  const first = new Date(year, month, 1);
  const startOffset = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const porDia = {};
  rows.forEach(m=>{
    const d = new Date(m.vencimento+"T00:00:00");
    if(d.getFullYear()===year && d.getMonth()===month) (porDia[d.getDate()] = porDia[d.getDate()]||[]).push(m);
  });
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(`<div class="cal-day empty"></div>`);
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const items = porDia[day]||[];
    const total = items.reduce((s,m)=>s+Number(m.valor||0),0);
    cells.push(`<div class="cal-day ${dateStr===hojeStr?'today':''}">
      <div class="dnum">${day}</div>
      ${items.slice(0,3).map(m=>`<div class="cev ${m.status==='pago'?'pago':(daysUntil(m.vencimento)<0?'atrasado':'pendente')}" title="${escapeHtml(empresaNome(m.empresa_id))}">${escapeHtml(empresaNome(m.empresa_id))}</div>`).join("")}
      ${items.length>3? `<div class="ctotal">+${items.length-3} mais</div>`:''}
      ${total>0? `<div class="ctotal">${fmtMoney(total)}</div>`:''}
    </div>`);
  }
  const monthLabel = calMonth.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  return `<div class="section">
    <div class="cal-nav">
      <button class="icon-btn" id="calPrev">← </button>
      <div class="cal-title">${monthLabel}</div>
      <button class="icon-btn" id="calNext">→</button>
      <button class="btn-sm" id="calHoje" style="margin-left:auto">Hoje</button>
    </div>
    <div class="calendar">
      ${["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].map(d=>`<div class="cal-head">${d}</div>`).join("")}
      ${cells.join("")}
    </div>
  </div>`;
}

function bindViewActions(){
  document.getElementById("cancelModal") && document.getElementById("cancelModal").addEventListener("click", closeModal);

  if(currentView==="empresas"){
    document.getElementById("btnNovaEmpresa").onclick = ()=> openModal(empresaForm());
    document.getElementById("btnExportEmpresas").onclick = ()=> exportCSV("empresas.csv", ["Nome","CNPJ","Regime","Responsável","Status"], STATE.empresas.map(e=>[e.nome,e.cnpj,e.regime,e.responsavel,e.ativo?"Ativa":"Inativa"]));
    document.querySelectorAll("[data-edit-empresa]").forEach(b=>b.onclick = ()=>{
      const e = STATE.empresas.find(e=>e.id===b.dataset.editEmpresa);
      openModal(empresaForm(e));
      document.getElementById("saveEmpresa").dataset.id = e.id;
    });
    document.querySelectorAll("[data-del-empresa]").forEach(b=>b.onclick = async ()=>{
      if(!await confirmDialog("Excluir esta empresa? Documentos, obrigações e financeiro vinculados também serão removidos.")) return;
      await sb.from("empresas").delete().eq("id", b.dataset.delEmpresa);
      await loadAll(); render();
    });
    bindModalCancel();
  }
  if(currentView==="documentos"){
    document.getElementById("btnNovoDoc").onclick = ()=> openModal(docForm());
    document.getElementById("filtroEmpresaDoc").onchange = (e)=>{ docEmpresaFiltro = e.target.value; render(); };
    document.querySelectorAll("[data-download-doc]").forEach(b=>b.onclick = ()=> downloadDoc(b.dataset.downloadDoc));
    document.querySelectorAll("[data-del-doc]").forEach(b=>b.onclick = async ()=>{
      if(!await confirmDialog("Excluir este documento?")) return;
      const doc = STATE.documentos.find(d=>d.id===b.dataset.delDoc);
      if(doc){ await sb.storage.from("documentos").remove([doc.storage_path]); await sb.from("documentos").delete().eq("id", doc.id); }
      await loadAll(); render();
    });
  }
  if(currentView==="obrigacoes"){
    document.getElementById("btnNovaObrigacao").onclick = ()=> openModal(obrigacaoForm());
    document.getElementById("btnNovaEntrega").onclick = ()=> openModal(entregaForm());
    document.querySelectorAll("[data-obrigtab]").forEach(b=>b.onclick = ()=>{ obrigTab = b.dataset.obrigtab; render(); });
    document.querySelectorAll("[data-entrega-status]").forEach(b=>b.onclick = async ()=>{
      await sb.from("obrigacoes_entregas").update({status:b.dataset.status, entregue_em: b.dataset.status==='entregue'? new Date().toISOString().slice(0,10):null}).eq("id", b.dataset.entregaStatus);
      await loadAll(); render();
    });
    document.querySelectorAll("[data-del-entrega]").forEach(b=>b.onclick = async ()=>{
      if(!await confirmDialog("Excluir esta entrega?")) return;
      await sb.from("obrigacoes_entregas").delete().eq("id", b.dataset.delEntrega);
      await loadAll(); render();
    });
    document.querySelectorAll("[data-del-obrigacao]").forEach(b=>b.onclick = async ()=>{
      if(!await confirmDialog("Excluir este modelo de obrigação e suas entregas?")) return;
      await sb.from("obrigacoes").delete().eq("id", b.dataset.delObrigacao);
      await loadAll(); render();
    });
    document.querySelectorAll("[data-gerar-entrega]").forEach(b=>b.onclick = async ()=>{
      const ob = STATE.obrigacoes.find(o=>o.id===b.dataset.gerarEntrega);
      if(!ob) return;
      const now = new Date();
      const competencia = String(now.getMonth()+1).padStart(2,"0")+"/"+now.getFullYear();
      const dia = ob.dia_vencimento || 20;
      let mes = now.getMonth()+1, ano = now.getFullYear();
      const venc = `${ano}-${String(mes).padStart(2,"0")}-${String(dia).padStart(2,"0")}`;
      const { error } = await sb.from("obrigacoes_entregas").insert({ obrigacao_id: ob.id, competencia, vencimento: venc, status:"pendente" });
      if(error){ toast(error.message, true); return; }
      await loadAll(); render();
    });
    const expEntregas = document.getElementById("btnExportEntregas");
    if(expEntregas) expEntregas.onclick = ()=>{
      const rows = [...STATE.entregas].sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
      exportCSV("obrigacoes.csv", ["Vencimento","Empresa","Tipo","Detalhe","Competência","Status"], rows.map(en=>{
        const ob = STATE.obrigacoes.find(o=>o.id===en.obrigacao_id);
        return [fmtDate(en.vencimento), ob?empresaNome(ob.empresa_id):"", ob?tipoInfo(ob.tipo).label:"", ob?ob.nome:"", en.competencia, en.status];
      }));
    };
    const printObrig = document.getElementById("btnPrintObrigacoes");
    if(printObrig) printObrig.onclick = printPage;
  }
  if(currentView==="financeiro"){
    document.getElementById("btnNovoFinanceiro").onclick = ()=> openModal(finTab==='mensalidades'? mensalidadeForm() : despesaForm());
    document.querySelectorAll("[data-fintab]").forEach(b=>b.onclick = ()=>{ finTab = b.dataset.fintab; render(); });
    document.querySelectorAll("[data-mensrecebedor]").forEach(b=>b.onclick = ()=>{ mensRecebedorFiltro = b.dataset.mensrecebedor; render(); });
    document.querySelectorAll("[data-mensvisao]").forEach(b=>b.onclick = ()=>{ mensVisao = b.dataset.mensvisao; render(); });
    const calPrev = document.getElementById("calPrev");
    if(calPrev) calPrev.onclick = ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()-1, 1); render(); };
    const calNext = document.getElementById("calNext");
    if(calNext) calNext.onclick = ()=>{ calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 1); render(); };
    const calHoje = document.getElementById("calHoje");
    if(calHoje) calHoje.onclick = ()=>{ const n=new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); render(); };
    const btnExportMens = document.getElementById("btnExportMens");
    if(btnExportMens) btnExportMens.onclick = ()=>{
      const rows = STATE.mensalidades.filter(m=> mensRecebedorFiltro==='todos' || m.recebedor===mensRecebedorFiltro);
      exportCSV("mensalidades.csv", ["Empresa","Competência","Valor","Vencimento","Recebedor","Status"], rows.map(m=>[empresaNome(m.empresa_id), m.competencia, m.valor, fmtDate(m.vencimento), m.recebedor||"", m.status]));
    };
    const btnPrintMens = document.getElementById("btnPrintMens");
    if(btnPrintMens) btnPrintMens.onclick = printPage;
    document.querySelectorAll("[data-mens-pago]").forEach(b=>b.onclick = async ()=>{ await sb.from("mensalidades").update({status:"pago", pago_em:new Date().toISOString().slice(0,10)}).eq("id", b.dataset.mensPago); await loadAll(); render(); });
    document.querySelectorAll("[data-mens-reabrir]").forEach(b=>b.onclick = async ()=>{ await sb.from("mensalidades").update({status:"pendente", pago_em:null}).eq("id", b.dataset.mensReabrir); await loadAll(); render(); });
    document.querySelectorAll("[data-del-mens]").forEach(b=>b.onclick = async ()=>{ if(!await confirmDialog("Excluir?")) return; await sb.from("mensalidades").delete().eq("id", b.dataset.delMens); await loadAll(); render(); });
    document.querySelectorAll("[data-desp-pago]").forEach(b=>b.onclick = async ()=>{ await sb.from("despesas").update({status:"pago", pago_em:new Date().toISOString().slice(0,10)}).eq("id", b.dataset.despPago); await loadAll(); render(); });
    document.querySelectorAll("[data-desp-reabrir]").forEach(b=>b.onclick = async ()=>{ await sb.from("despesas").update({status:"pendente", pago_em:null}).eq("id", b.dataset.despReabrir); await loadAll(); render(); });
    document.querySelectorAll("[data-del-desp]").forEach(b=>b.onclick = async ()=>{ if(!await confirmDialog("Excluir?")) return; await sb.from("despesas").delete().eq("id", b.dataset.delDesp); await loadAll(); render(); });
  }
  if(currentView==="licencas"){
    document.getElementById("btnNovaLicenca").onclick = ()=> openModal(licencaForm());
    document.querySelectorAll("[data-del-licenca]").forEach(b=>b.onclick = async ()=>{ if(!await confirmDialog("Excluir?")) return; await sb.from("licencas").delete().eq("id", b.dataset.delLicenca); await loadAll(); render(); });
  }
  if(currentView==="tarefas"){
    document.getElementById("btnNovaTarefa").onclick = ()=> openModal(tarefaForm());
    document.querySelectorAll("[data-tarefa]").forEach(b=>b.onclick = ()=>{
      const t = STATE.tarefas.find(t=>t.id===b.dataset.tarefa);
      openModal(tarefaForm(t));
    });
  }
  if(currentView==="agenda"){
    document.getElementById("btnNovaReuniao").onclick = ()=> openModal(reuniaoForm());
    document.querySelectorAll("[data-reuniao-status]").forEach(b=>b.onclick = async ()=>{
      await sb.from("reunioes").update({status:b.dataset.status}).eq("id", b.dataset.reuniaoStatus);
      await loadAll(); render();
    });
    document.querySelectorAll("[data-del-reuniao]").forEach(b=>b.onclick = async ()=>{
      if(!await confirmDialog("Excluir esta reunião?")) return;
      await sb.from("reunioes").delete().eq("id", b.dataset.delReuniao);
      await loadAll(); render();
    });
  }
  if(currentView==="dashboard"){
    const bc = document.getElementById("briefingClose");
    if(bc) bc.onclick = ()=>{ briefingDismissed = true; render(); };
  }
}

/* Delegated save handlers — bound once globally to avoid stacking listeners across renders */
document.body.addEventListener("click", (e)=>{
  empresaSaveHandler(e);
  docSaveHandler(e);
  obrigacoesSaveHandler(e);
  financeiroSaveHandler(e);
  licencaSaveHandler(e);
  tarefaSaveHandler(e);
  reuniaoSaveHandler(e);
});

async function empresaSaveHandler(e){
  if(e.target.id !== "saveEmpresa") return;
  const id = e.target.dataset.id;
  const payload = {
    nome: document.getElementById("fNome").value.trim(),
    cnpj: document.getElementById("fCnpj").value.trim(),
    regime: document.getElementById("fRegime").value,
    responsavel: document.getElementById("fResp").value.trim(),
    telefone: document.getElementById("fTel").value.trim(),
    email: document.getElementById("fEmail").value.trim(),
    endereco: document.getElementById("fEnd").value.trim(),
    observacoes: document.getElementById("fObs").value.trim(),
    ativo: document.getElementById("fAtivo").checked,
  };
  if(!payload.nome){ toast("Informe o nome da empresa", true); return; }
  const { error } = id ? await sb.from("empresas").update(payload).eq("id", id) : await sb.from("empresas").insert(payload);
  if(error){ toast(error.message, true); return; }
  closeModal(); toast("Empresa salva!"); await loadAll(); render();
}
async function docSaveHandler(e){
  if(e.target.id !== "saveDoc") return;
  const empresa_id = document.getElementById("fDocEmpresa").value;
  const tipo = document.getElementById("fDocTipo").value;
  const data_validade = document.getElementById("fDocValidade").value || null;
  const fileInput = document.getElementById("fDocArquivo");
  const file = fileInput.files[0];
  if(!empresa_id || !file){ toast("Selecione a empresa e o arquivo", true); return; }
  const path = `${empresa_id}/${Date.now()}_${file.name}`;
  const { error: upErr } = await sb.storage.from("documentos").upload(path, file);
  if(upErr){ toast(upErr.message, true); return; }
  const { error } = await sb.from("documentos").insert({ empresa_id, tipo, nome_arquivo:file.name, storage_path:path, tamanho:file.size, data_validade });
  if(error){ toast(error.message, true); return; }
  closeModal(); toast("Documento enviado!"); await loadAll(); render();
}
async function downloadDoc(id){
  const doc = STATE.documentos.find(d=>d.id===id);
  if(!doc) return;
  const { data, error } = await sb.storage.from("documentos").createSignedUrl(doc.storage_path, 60);
  if(error){ toast(error.message, true); return; }
  window.open(data.signedUrl, "_blank");
}
async function obrigacoesSaveHandler(e){
  if(e.target.id === "saveObrigacao"){
    const payload = {
      empresa_id: document.getElementById("fObEmpresa").value,
      tipo: document.getElementById("fObTipo").value,
      nome: document.getElementById("fObNome").value.trim(),
      periodicidade: document.getElementById("fObPeriodo").value,
      dia_vencimento: Number(document.getElementById("fObDia").value)||20,
    };
    if(!payload.empresa_id){ toast("Selecione a empresa", true); return; }
    const { error } = await sb.from("obrigacoes").insert(payload);
    if(error){ toast(error.message, true); return; }
    closeModal(); toast("Modelo criado!"); await loadAll(); render();
  }
  if(e.target.id === "saveEntrega"){
    const payload = {
      obrigacao_id: document.getElementById("fEnObrigacao").value,
      competencia: document.getElementById("fEnCompetencia").value.trim(),
      vencimento: document.getElementById("fEnVencimento").value,
      status: "pendente",
    };
    if(!payload.obrigacao_id || !payload.competencia || !payload.vencimento){ toast("Preencha todos os campos", true); return; }
    const { error } = await sb.from("obrigacoes_entregas").insert(payload);
    if(error){ toast(error.message, true); return; }
    closeModal(); toast("Entrega criada!"); await loadAll(); render();
  }
}
async function financeiroSaveHandler(e){
  if(e.target.id === "saveMens"){
    const payload = {
      empresa_id: document.getElementById("fMensEmpresa").value,
      competencia: document.getElementById("fMensCompetencia").value.trim(),
      valor: Number(document.getElementById("fMensValor").value)||0,
      vencimento: document.getElementById("fMensVencimento").value,
      recebedor: document.getElementById("fMensRecebedor").value || null,
      status: "pendente",
    };
    if(!payload.empresa_id || !payload.vencimento){ toast("Preencha empresa e vencimento", true); return; }

    if(error){ toast(error.message, true); return; }
    closeModal(); toast("Mensalidade criada!"); await loadAll(); render();
  }
  if(e.target.id === "saveDesp"){
    const payload = {
      descricao: document.getElementById("fDespDescricao").value.trim(),
      categoria: document.getElementById("fDespCategoria").value.trim(),
      valor: Number(document.getElementById("fDespValor").value)||0,
      vencimento: document.getElementById("fDespVencimento").value,
      status: "pendente",
    };
    if(!payload.descricao || !payload.vencimento){ toast("Preencha descrição e vencimento", true); return; }
    const { error } = await sb.from("despesas").insert(payload);
    if(error){ toast(error.message, true); return; }
    closeModal(); toast("Despesa criada!"); await loadAll(); render();
  }
}

async function reuniaoSaveHandler(e){
  if(e.target.id !== "saveReuniao") return;
  const dataHora = document.getElementById("fReuDataHora").value;
  const payload = {
    titulo: document.getElementById("fReuTitulo").value.trim(),
    empresa_id: document.getElementById("fReuEmpresa").value || null,
    data_hora: dataHora ? new Date(dataHora).toISOString() : null,
    local: document.getElementById("fReuLocal").value.trim(),

  };
  if(!payload.titulo || !payload.data_hora){ toast("Preencha título e data/hora", true); return; }
  const { error } = await sb.from("reunioes").insert(payload);
  if(error){ toast(error.message, true); return; }
  closeModal(); toast("Reunião agendada!"); await loadAll(); render();
}
